{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Hangarin{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% progressive_web_app_meta %}
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-backdrop" aria-hidden="true">
            <span class="drift drift-1">🌱</span>
            <span class="drift drift-2">🍃</span>
            <span class="drift drift-3">🌿</span>
            <span class="drift drift-4">🍀</span>
            <span class="drift drift-5">🍃</span>
        </div>

        {% if messages %}
        <div class="toast-stack" id="toast-stack" role="status">
            {% for message in messages %}
            <div class="toast toast-{{ message.tags|default:'success' }}">
                <span>{{ message }}</span>
                <button type="button" class="toast-close" aria-label="Dismiss">&times;</button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <a class="auth-back" href="{% block auth_back_url %}{% url 'account_login' %}{% endblock %}" data-history-back aria-label="Go back">
            <span aria-hidden="true">←</span> Back
        </a>
        {% block auth_content %}{% endblock %}
    </div>
    <script src="{% static 'js/app.js' %}" defer></script>
    <script src="{% static 'js/pwa.js' %}" defer></script>
</body>
</html>
