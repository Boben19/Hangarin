{% extends "base.html" %}

{% block title %}Delete | Hangarin{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card form-card-danger">
        <div class="form-card-head">
            <h1>Delete this?</h1>
            <a href="{{ cancel_url }}" class="form-close" aria-label="Close">&times;</a>
        </div>

        <p class="confirm-copy">
            You're about to permanently delete {{ object_label }}. There's no undo on this one.
        </p>

        <form method="post" class="form-actions">
            {% csrf_token %}
            <a href="{{ cancel_url }}" class="btn btn-outline-green btn-small">Keep it</a>
            <button type="submit" class="btn btn-danger btn-small">Yes, delete it</button>
        </form>
    </div>
</div>
{% endblock %}
