{% load static %}<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Offline | Hangarin</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="auth-mark">🍂</span>
                <h1>You're offline</h1>
                <p class="auth-sub">
                    Hangarin can't reach the internet right now, and your tasks
                    live on the server, so there's nothing to show yet.
                </p>
            </div>
            {# empty href = reload whatever page you were trying to open #}
            <a href="" class="btn btn-primary auth-submit">Try again</a>
            <p class="auth-switch">Check your Wi-Fi or mobile data, then tap the button.</p>
        </div>
    </div>
</body>
</html>
