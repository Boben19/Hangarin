{% load socialaccount %}
{% if social_providers %}
<div class="social-buttons">
    {% for provider in social_providers %}
    <form method="post" action="{% provider_login_url provider.id process='login' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-social btn-{{ provider.id }}">
            <span class="social-ico">{% if provider.id == 'google' %}G{% elif provider.id == 'facebook' %}f{% else %}&#9679;{% endif %}</span>
            Continue with {{ provider.name }}
        </button>
    </form>
    {% endfor %}
</div>
<div class="auth-divider"><span>or use your account</span></div>
{% endif %}
