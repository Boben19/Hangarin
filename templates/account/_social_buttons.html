{% load socialaccount %}
{% if social_providers %}
<div class="social-buttons">
    {% for provider in social_providers %}
    <form method="post" action="{% provider_login_url provider.id process='login' %}" data-needs-online>
        {% csrf_token %}
        <button type="submit" class="btn btn-social btn-{{ provider.id }}">
            <span class="social-ico" aria-hidden="true">{% if provider.id == 'google' %}G{% elif provider.id == 'facebook' %}f{% elif provider.id == 'github' %}<svg class="i-fill" viewBox="0 0 16 16" width="15" height="15"><use href="#i-github"></use></svg>{% endif %}</span>
            Continue with {{ provider.name }}
        </button>
    </form>
    {% endfor %}
</div>
<div class="auth-divider"><span>or use your account</span></div>
{% endif %}
