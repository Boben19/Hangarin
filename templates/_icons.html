{% comment %}
Every icon in the app lives here once and is drawn with
<svg class="i"><use href="#i-name"></use></svg>. They share one stroke style
(set by .i in style.css) so they all look like they belong together, and they
take the colour of the text around them. Included at the top of <body>.
